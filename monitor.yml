name: Tech Update Monitor

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (UTC)
  workflow_dispatch:          # the manual "Run workflow" button
    inputs:
      send_status:
        description: "Post a current-status summary to Google Chat"
        type: boolean
        default: true
      test_sources:
        description: "Send a TEST alert for these source ids (comma-separated, e.g. adjust-android,firebase-ios)"
        type: string
        default: ""

permissions:
  contents: write             # needed to save state.json back to the repo

concurrency:
  group: update-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install packages
        run: pip install feedparser requests PyYAML beautifulsoup4
      - name: Check for updates
        env:
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
          TEST_SOURCES: ${{ inputs.test_sources }}
        run: python monitor.py ${{ inputs.send_status && '--status' || '' }}
      - name: Save state
        run: |
          git config user.name  "update-monitor-bot"
          git config user.email "update-monitor-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "chore: update monitor state" && git push)
