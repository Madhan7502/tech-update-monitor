name: Tech Update Monitor

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (UTC)
  workflow_dispatch: {}       # allows a manual "Run workflow" button

permissions:
  contents: write             # needed to save state.json back to the repo

concurrency:
  group: update-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check for updates
        env:
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
        run: python monitor.py
      - name: Save state
        run: |
          git config user.name  "update-monitor-bot"
          git config user.email "update-monitor-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "chore: update monitor state" && git push)
